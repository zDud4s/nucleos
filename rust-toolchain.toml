# The version is pinned here; the HOST is not. A channel carrying a host tuple
# ("1.97.1-x86_64-pc-windows-gnu") names a toolchain that does not run on macOS or Linux, so it
# made this file unusable anywhere but Windows.
#
# On Windows the GNU host is still the right one on the owner's machine: its Visual Studio Build
# Tools lack the Windows SDK, so the MSVC target cannot link, while the GNU toolchain ships a
# self-contained linker (rustup's "rust-mingw" component). That choice now lives on the machine:
#     rustup set default-host x86_64-pc-windows-gnu
# run once, reversible with `rustup set default-host x86_64-pc-windows-msvc`. A per-directory
# `rustup override` was rejected because the daemon opens new worktrees under new paths, each of
# which would start without it. CI's Windows leg runs the same line (.github/workflows/ci.yml).

# Pinned to an exact version, not to "stable", because "stable" is a MOVING target and rustfmt is
# not stable across it. Twice in two days a tree that was green when it was committed went red on
# `cargo fmt --check` without anyone touching it — once in three files this repo had not changed for
# weeks, once in code another branch had committed hours earlier. Every branch open at that moment
# pays the same toll independently, and the diff it produces is noise that has to be committed
# before anything real can land.
#
# The cost of pinning is deliberate and small: a new toolchain does not arrive until someone changes
# this line, so the upgrade becomes one commit, reviewed once, that reformats whatever the new
# rustfmt wants. That is the trade — reformatting on a schedule the repo chooses rather than on the
# release schedule of a channel it does not control.
#
# `components` is spelled out rather than left to the default profile: a version pin makes rustup
# fetch a toolchain the machine may not have, and a fresh one without these two fails the gate on
# its first `cargo fmt`/`cargo clippy` rather than on anything the person wrote.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]

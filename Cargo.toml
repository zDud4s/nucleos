[workspace]
resolver = "2"
members = ["core"]
# The Tauri shell's Rust side (shell/src-tauri) is a standalone package, deliberately
# NOT a member of this workspace — it keeps its own Cargo.lock so the daemon's deps
# (sqlx/axum/...) and the shell's (tauri/wry/...) resolve independently. Excluding it
# also lets `npm run tauri dev` build it without the "package believes it's in a
# workspace" error.
exclude = ["shell/src-tauri"]

[profile.dev]
# No debuginfo at all. Full DWARF made `target/` grow past 20 GB on this machine, and
# with any debuginfo on (even `line-tables-only`) sccache's cache key includes the cargo
# target-dir path, so every `.cargo-target-<branch>` misses and recompiles the ~290
# dependencies. Measured 2026-10-01 with sccache 0.18: `line-tables-only` / `1` missed
# across two target dirs, `debug = 0` hit.
# Lost: line numbers in panic backtraces (function names stay). To restore them, or to
# inspect variables in a debugger, set `debug = "line-tables-only"` or `debug = true`.
# `profile.test` inherits this, so `cargo test` gets the same behaviour.
debug = 0

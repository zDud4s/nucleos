# Which tests each change in this repository needs, read by the NucleOS daemon
# (test-selection design, §3.1).
# Changing this file runs every group, and a direct edit by an agent asks the owner.
version: 1
tests:
  groups:
    core:
      # .nucleos/flows.yaml: the declared flows map::flows checks against core/.
      paths: [core/, Cargo.toml, Cargo.lock, rust-toolchain.toml, .config/, .nucleos/flows.yaml]
      check: cargo clippy -p nucleos-core --all-targets -- -D warnings
      command: bash scripts/gates.sh core
    sidecars:
      paths: [sidecars/, scripts/build-sidecars.sh]
      command: bash scripts/gates.sh sidecars
    shell:
      paths: [shell/, scripts/csp-gate.mjs]
      command: bash scripts/gates.sh shell
    tauri:
      paths: [shell/src-tauri/]
      command: bash scripts/gates.sh tauri
    hooks:
      paths:
        - core/hooks/
        # A byte copy of core/hooks/ask_daemon.py, held equal by test-hook-filter.py.
        - .claude/hooks/ask_daemon.py
        - scripts/test-hook-filter.py
        - scripts/test-gates-summary.py
        - scripts/own-cargo-target.sh
        - scripts/test-own-cargo-target.py
        - scripts/build-slot.sh
        - scripts/test-build-slot.py
        - scripts/run-daemon.ps1
        - scripts/test-run-daemon.py
        - scripts/refresh-models.py
        - scripts/test-refresh-models.py
        # Writes .githooks/ (gitignored); the post-checkout hook it writes is run by the test.
        - scripts/install-hooks.sh
        - scripts/test-post-checkout.py
        - core/assets/nucleos-dev/scripts/
        # One version across manifests (gates.sh hooks: "release: *").
        - VERSION
        - scripts/bump-version.py
        - scripts/test-bump-version.py
        - scripts/release-manifest.py
        - scripts/test-release-manifest.py
        - scripts/install.ps1
        - scripts/install.sh
        - scripts/test-install-scripts.py
      command: bash scripts/gates.sh hooks
    broker:
      # The machine-wide build broker, its classifier and hook, and their tests.
      paths:
        - scripts/heavy.py
        - scripts/heavy_classify.py
        - scripts/heavy_guard.py
        - scripts/heavy_cost.py
        # Its test, heavy_tests/test_heavy_watch.py, is picked up by the same unittest discovery.
        - scripts/heavy_watch.py
        - scripts/heavy_tests/
      command: bash scripts/gates.sh broker
  gate_entrypoints: [scripts/gates.sh, scripts/gate-diff.sh]
  tools:
    cargo: { allow: [fmt, metadata, tree, add, remove, update, search] }
    rustc: {}
    go: { allow: [mod, list, env, version, fmt] }
    tsc: {}
    vitest: {}
    npm: { allow: [install, ci, ls, view, outdated] }
    npx: {}
  warm:
    CARGO_TARGET_DIR: { dir: target }
    GOCACHE: { dir: 'shared:gocache' }
  full_sweep: [scripts/gates.sh, scripts/gate-diff.sh, .github/workflows/]
  no_test:
    # A measuring tool run by hand before and after a refactor; no gate calls it.
    - scripts/code_metrics.py
    - scripts/stage-bundle-bins.sh
    - scripts/css-contract.mjs
    - scripts/preview-shots.mjs
    - scripts/preview-shots-all.mjs
    - scripts/preview-why.mjs
    - scripts/csp-in-the-window.mjs
    - scripts/tool-surface.mjs
    - scripts/doctor.sh
    - scripts/leave-nothing-behind.mjs
    - scripts/update-shell.ps1
    # Deletes regenerable build output on the owner's machine; run by hand.
    - scripts/free-disk.ps1
    # Serve the preview live for an agent-driven dev-browser window; run by hand.
    - scripts/live-preview.mjs
    - scripts/live-preview-agent.js
    - docs/
    - design/
    - .githooks/
    - AGENTS.md
    - RELEASING.md
    - CLAUDE.md
    - DESIGN.md
    - PRODUCT.md
    - .impeccable.md
    - .impeccable/
    - .gitignore
    - .gitattributes
    - .gitleaksignore
    - LICENSE
    - CONTRIBUTING.md
    - README.md
    - THREAT_MODEL.md

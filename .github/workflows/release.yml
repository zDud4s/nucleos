# Release: build, sign and publish the three-platform installers plus latest.json from a v* tag.
#
# Owner's steps, once (the full text is RELEASING.md):
#   1. npm run tauri signer generate -- -w ~/.tauri/nucleos.key
#   2. Paste the printed .pub into `plugins.updater.pubkey` in shell/src-tauri/tauri.conf.json.
#   3. Create the repository secrets TAURI_SIGNING_PRIVATE_KEY (the key file's content) and
#      TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#   4. For macOS, create the stable self-signed certificate and the secrets APPLE_CERTIFICATE,
#      APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY (RELEASING.md). Without them the macOS
#      leg fails: an ad-hoc signature would change identity every release and re-prompt the TCC
#      grants (microphone, accessibility) after each update.
# Per release:
#   5. python scripts/bump-version.py X.Y.Z, commit, then push the tag vX.Y.Z (it must equal VERSION).
# The repository's releases must be public: the updater feed (latest.json) is fetched anonymously.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: --bundles nsis
          - os: macos-latest
            bundles: --bundles app,dmg
          - os: ubuntu-22.04
            bundles: --bundles appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # `python3` is not trusted on the Windows runner (see ci.yml), so pin one and call `python`.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Node 24 ships npm 11, the npm the lockfile is written with locally. npm 10 (Node 22) reads
      # an npm 11 lockfile as out of sync -- bundled deps of @tailwindcss/oxide-wasm32-wasi -- and
      # `npm ci` refuses it.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config patchelf

      # Read from rust-toolchain.toml and passed as an argument, so the version lives in one place.
      # Windows runners default to the MSVC host; this repository's Windows builds use GNU (see
      # rust-toolchain.toml), so that leg sets the host first — the same line a Windows developer runs.
      - name: Install the pinned toolchain
        run: |
          if [ "$RUNNER_OS" = Windows ]; then rustup set default-host x86_64-pc-windows-gnu; fi
          toolchain="$(sed -n 's/^channel *= *"\(.*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --component clippy --component rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install shell dependencies
        working-directory: shell
        run: npm ci

      - name: Guard the release config
        shell: bash
        run: |
          if grep -q 'REPLACE_WITH_' shell/src-tauri/tauri.conf.json; then
            echo "::error::shell/src-tauri/tauri.conf.json still contains REPLACE_WITH_ (the updater pubkey is not set)"; exit 1
          fi
          # VERSION, every manifest and the tag are one number.
          python scripts/bump-version.py --check --expect "${GITHUB_REF_NAME#v}"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is empty: the updater artifacts would not be signed"; exit 1
          fi
          if [ "$RUNNER_OS" = macOS ] && { [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; }; then
            echo "::error::secrets APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY are empty: refusing an ad-hoc macOS signature"; exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Stage the núcleo and the sidecars
        shell: bash
        run: bash scripts/stage-bundle-bins.sh

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: shell
          tagName: ${{ github.ref_name }}
          releaseName: NucleOS ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json --features release-bundle ${{ matrix.bundles }}

      - name: Verify the macOS signature carries the stable certificate
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          app="$(find shell/src-tauri/target -maxdepth 6 -name 'NucleOS.app' -type d | head -n 1)"
          [ -n "$app" ] || { echo "::error::no NucleOS.app under shell/src-tauri/target"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | tee /tmp/codesign.txt
          grep -q "Authority=$APPLE_SIGNING_IDENTITY" /tmp/codesign.txt             || { echo "::error::the app is not signed by $APPLE_SIGNING_IDENTITY"; exit 1; }
          # A certificate-anchored requirement is what keeps the TCC grants across updates.
          codesign -d -r- "$app" 2>&1 | grep -q 'certificate leaf = H"'             || { echo "::error::the designated requirement is not anchored to the certificate"; exit 1; }

  # Checks the draft is complete, adds SHA256SUMS, and only then makes it public, so latest.json
  # never goes live half-filled and the install scripts always have the checksums to verify against.
  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Prove the draft is complete and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
          python3 scripts/release-manifest.py verify --dir release-assets --version "$version"
          python3 scripts/release-manifest.py sums --dir release-assets --version "$version"
          # The install scripts ride along as assets, so `releases/latest/download/install.sh` always
          # matches the release they install. They are not in SHA256SUMS: they are what verifies it.
          gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS scripts/install.sh scripts/install.ps1             --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

# Release: build, sign and publish the three-platform installers plus latest.json from a v* tag.
#
# Owner's steps, once (the full text is RELEASING.md):
#   1. npm run tauri signer generate -- -w ~/.tauri/nucleos.key
#   2. Paste the printed .pub into `plugins.updater.pubkey` in shell/src-tauri/tauri.conf.json.
#   3. Create the repository secrets TAURI_SIGNING_PRIVATE_KEY (the key file's content) and
#      TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#   4. For macOS, create the stable self-signed certificate and the secrets APPLE_CERTIFICATE,
#      APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY (RELEASING.md). Without them the macOS
#      leg fails: an ad-hoc signature would change identity every release and re-prompt the TCC
#      grants (microphone, accessibility) after each update.
# Per release:
#   5. python scripts/bump-version.py X.Y.Z, commit, then push the tag vX.Y.Z (it must equal VERSION).
# The repository's releases must be public: the updater feed (latest.json) is fetched anonymously.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # A pushed tag must not publish a build nobody tested: wait for the `gates` workflow (ci.yml) to
  # finish green for the exact tagged commit, and refuse otherwise. Every build job needs this one.
  ci-green:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require a successful CI run for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 60); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '.workflow_runs')"
            if [ "$(echo "$runs" | jq '[.[] | select(.conclusion == "success")] | length')" -gt 0 ]; then
              echo "CI succeeded for $GITHUB_SHA"
              exit 0
            fi
            if [ "$(echo "$runs" | jq '[.[] | select(.status != "completed")] | length')" -eq 0 ]; then
              echo "::error::no successful CI run (workflow gates) for $GITHUB_SHA; push the tag only after CI is green"
              exit 1
            fi
            echo "CI still running for $GITHUB_SHA (attempt $attempt/60)"
            sleep 60
          done
          echo "::error::timed out waiting for CI on $GITHUB_SHA"
          exit 1

  build:
    needs: ci-green
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: --bundles nsis
          - os: macos-latest
            bundles: --bundles app,dmg
          - os: ubuntu-22.04
            bundles: --bundles appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # `python3` is not trusted on the Windows runner (see ci.yml), so pin one and call `python`.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # Node 24, the major the shell is developed on. `npm ci` needs a lockfile written by a
      # current npm: older npm 11 releases (11.6) drop the nested @emnapi entries of
      # @tailwindcss/oxide-wasm32-wasi, and every newer npm then reads the lock as out of sync.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: shell/package-lock.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: 1.26.x

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config patchelf rpm

      # Read from rust-toolchain.toml and passed as an argument, so the version lives in one place.
      # Windows runners default to the MSVC host; this repository's Windows builds use GNU (see
      # rust-toolchain.toml), so that leg sets the host first — the same line a Windows developer runs.
      - name: Install the pinned toolchain
        run: |
          if [ "$RUNNER_OS" = Windows ]; then rustup set default-host x86_64-pc-windows-gnu; fi
          toolchain="$(sed -n 's/^channel *= *"\(.*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --component clippy --component rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install shell dependencies
        working-directory: shell
        run: npm ci

      - name: Guard the release config
        shell: bash
        run: |
          if grep -q 'REPLACE_WITH_' shell/src-tauri/tauri.conf.json; then
            echo "::error::shell/src-tauri/tauri.conf.json still contains REPLACE_WITH_ (the updater pubkey is not set)"; exit 1
          fi
          # VERSION, every manifest and the tag are one number.
          python scripts/bump-version.py --check --expect "${GITHUB_REF_NAME#v}"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::secret TAURI_SIGNING_PRIVATE_KEY is empty: the updater artifacts would not be signed"; exit 1
          fi
          if [ "$RUNNER_OS" = macOS ] && { [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; }; then
            echo "::error::secrets APPLE_CERTIFICATE / APPLE_SIGNING_IDENTITY are empty: refusing an ad-hoc macOS signature"; exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Stage the núcleo and the sidecars
        shell: bash
        run: bash scripts/stage-bundle-bins.sh

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        with:
          projectPath: shell
          tagName: ${{ github.ref_name }}
          releaseName: NucleOS ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json --features release-bundle ${{ matrix.bundles }}

      - name: Verify the macOS signature carries the stable certificate
        if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          app="$(find shell/src-tauri/target -maxdepth 6 -name 'NucleOS.app' -type d | head -n 1)"
          [ -n "$app" ] || { echo "::error::no NucleOS.app under shell/src-tauri/target"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv "$app" 2>&1 | tee /tmp/codesign.txt
          grep -q "Authority=$APPLE_SIGNING_IDENTITY" /tmp/codesign.txt             || { echo "::error::the app is not signed by $APPLE_SIGNING_IDENTITY"; exit 1; }
          # A certificate-anchored requirement is what keeps the TCC grants across updates.
          codesign -d -r- "$app" 2>&1 | grep -q 'certificate leaf = H"'             || { echo "::error::the designated requirement is not anchored to the certificate"; exit 1; }

  # Installs the draft's .deb/.rpm in a clean container, starts the daemon and survives a kill -9.
  smoke-linux:
    needs: build
    runs-on: ubuntu-22.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "fedora:latest"]
    steps:
      - name: Install gh and the tools the smoke script needs
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            # gh is not in the stock Ubuntu 22.04 repositories: use GitHub's official apt repository.
            apt-get update -y
            apt-get install -y curl git ca-certificates gpg
            mkdir -p -m 755 /etc/apt/keyrings
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
            chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
            apt-get update -y
            apt-get install -y gh
          else
            dnf install -y curl git gh
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the draft's Linux packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir smoke-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir smoke-assets --pattern '*.deb' --pattern '*.rpm'

      - name: Smoke-test the bundle
        run: bash scripts/smoke-bundle.sh smoke-assets

  # Checks the draft is complete, adds SHA256SUMS, and only then makes it public, so latest.json
  # never goes live half-filled and the install scripts always have the checksums to verify against.
  # It also waits for the Linux smoke test: a bundle that does not install or start is never published.
  publish:
    needs: [build, smoke-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Prove the draft is complete and publish it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir release-assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir release-assets
          python3 scripts/release-manifest.py verify --dir release-assets --version "$version"
          python3 scripts/release-manifest.py sums --dir release-assets --version "$version"
          # The install scripts ride along as assets, so `releases/latest/download/install.sh` always
          # matches the release they install. They are not in SHA256SUMS: they are what verifies it.
          gh release upload "$GITHUB_REF_NAME" release-assets/SHA256SUMS scripts/install.sh scripts/install.ps1             --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

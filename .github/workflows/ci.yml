# CI reruns the five `scripts/gates.sh` targets for each push and pull request.
#
# windows-latest is not a preference. The núcleo is Windows-only by construction: `keyring` builds
# with the windows-native-keyring-store backend, autostart shells out to `schtasks`, and the run
# supervisor to `taskkill /T /F`. There is no other runner this crate compiles on.
#
# Each job calls `scripts/gates.sh <stack>` rather than repeating its commands. The commands moved
# into that script precisely because living in shell history is how a red suite and an AGENTS.md
# claiming "green" managed to coexist; copying them here would recreate the same split, one file
# further away.
#
# One job per target rather than one `gates.sh all`: `all` covers the hermetic targets, while the
# separate security target is deliberately outside it. The script still runs every stack after one
# fails — the useful property locally, where you want all three stack answers in one pass. In CI the
# jobs give the same completeness in parallel, and name which target broke without reading a log.
#
# That per-target listing is also a trap, and it caught the `hooks` target on the day it was added:
# a new target inside `all` does NOT start running here, because nothing here runs `all`. A target
# added to the script has to be added to this file too, or it is covered locally and nowhere else.

name: gates

on:
  push:
  pull_request:

# A second push supersedes the first: the older run is answering a question nobody is asking now.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No toolchain is named here on purpose: `rust-toolchain.toml` pins the version and the GNU
      # host, and `rustup toolchain install` with no argument installs exactly what that file names
      # — components included, which is why no `rustup component add` follows it.
      #
      # NOT `rustup show`, which is what this said until the first run answered it: since rustup
      # 1.28 `show` no longer installs a toolchain it cannot find, it fails. The runner ships the
      # MSVC stable and nothing else, so the job died here in 1s, before a single gate ran.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      # The workspace root is the repo root (`Cargo.toml` has `members = ["core"]`), which is this
      # action's default — `shell/src-tauri` is deliberately excluded from it and keeps its own
      # lockfile, and no gate builds it.
      - uses: Swatinem/rust-cache@v2

      - run: bash scripts/gates.sh core

  # The Python this repo ships — chiefly `.claude/hooks/ask_daemon.py`, which `core/src/triage.rs`
  # compiles INTO the daemon and which decides what a person's git commands may do. No Rust, no Go,
  # no Node, so this job installs none of them.
  hooks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned and installed rather than trusting the image's own Python. windows-latest also ships
      # an App Execution Alias named `python3` that is not an interpreter — it prints "Python was
      # not found", points at the Microsoft Store, and exits 49 — and `gates.sh` probes past it by
      # running the candidate rather than locating it. setup-python puts a real one first either
      # way, so the two guards are independent.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: bash scripts/gates.sh hooks

  security:
    runs-on: windows-latest
    steps:
      # A depth-1 checkout only sees the tip; a secret committed then removed is exactly what this
      # job must find, so it needs the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The pinned GNU toolchain from rust-toolchain.toml, installed before cargo-audit is compiled
      # — same command and same reason as the core job, whose comment carries the detail.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install security tools
        run: |
          cargo install cargo-audit --locked
          gitleaks_version=8.30.0
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_windows_x64.zip" \
            --output "$RUNNER_TEMP/gitleaks.zip"
          unzip -q "$RUNNER_TEMP/gitleaks.zip" -d "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - run: bash scripts/gates.sh security

  sidecars:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The highest any sidecar's go.mod asks for. `gates.sh` discovers the modules rather than
          # listing them, so a new sidecar needs nothing here unless it needs a newer Go.
          go-version: '1.26.x'
          cache-dependency-path: sidecars/*/go.sum

      - run: bash scripts/gates.sh sidecars

  shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell/package-lock.json

      # `gates.sh shell` refuses to run without node_modules rather than installing them, because
      # locally that state means "you have not set this up", not "install it for me".
      - name: Install shell dependencies
        working-directory: shell
        run: npm ci

      # `tauri::generate_context!()` embeds shell/dist at COMPILE time, and dist is gitignored — no
      # checkout ever carries one. `gates.sh shell` refuses its three src-tauri legs without it, so
      # until this step existed the job reported "frontend not built" and never reached them.
      - name: Build the frontend
        working-directory: shell
        run: npm run build

      # Those three legs are cargo commands, governed by the repo-root rust-toolchain.toml like
      # every other one. This job named no toolchain at all while they were not running.
      - name: Install the pinned toolchain
        run: rustup toolchain install

      - run: bash scripts/gates.sh shell

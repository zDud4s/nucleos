# CI reruns the `scripts/gates.sh` targets on Windows, Linux and macOS for each push and pull request.
#
# All three, because the núcleo, the sidecars and the shell are built for all three
# (.ai/specs/2026-09-11-portabilidade-macos-e-linux-design.md). Windows is still where the owner
# works, so its leg keeps the GNU host the owner's machine uses; see rust-toolchain.toml.
#
# Each job calls `scripts/gates.sh <target>` rather than repeating its commands: one definition of
# green, run in two places. One job per target rather than one `gates.sh all`, so a red job names
# the target that broke. The trap that comes with it: a target added to `gates.sh` does NOT start
# running here until it is added to this file too.

name: gates

on:
  push:
  pull_request:

# A second push supersedes the first: the older run is answering a question nobody is asking now.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          # THE switch. macOS minutes bill at a multiple on a private repository, which is why this was
          # "false" (macOS only on pull requests and master) until the repository went public. Public
          # minutes are free, so every push now gets all three. Set it back if the repository goes private.
          MACOS_ON_EVERY_PUSH: "true"
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$MACOS_ON_EVERY_PUSH" = true ] || [ "$EVENT" = pull_request ] || [ "$REF" = refs/heads/master ]; then
            echo 'os=["windows-latest","ubuntu-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["windows-latest","ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  core:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      # Read from rust-toolchain.toml and passed as an argument, so the version lives in one place.
      # Windows runners default to the MSVC host; this repository's Windows builds use GNU (see
      # rust-toolchain.toml), so that leg sets the host first — the same line a Windows developer runs.
      - name: Install the pinned toolchain
        run: |
          if [ "$RUNNER_OS" = Windows ]; then rustup set default-host x86_64-pc-windows-gnu; fi
          toolchain="$(sed -n 's/^channel *= *"\(.*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --component clippy --component rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: bash scripts/gates.sh core

  # The Python this repo ships — chiefly `core/hooks/ask_daemon.py`, which `core/src/autopilot.rs`
  # and `core/src/triage.rs` compile INTO the daemon (`.claude/hooks/` holds a byte copy) and which
  # decides what a person's git commands may do. No Rust, no Go, no Node, so this job installs none
  # of them.
  hooks:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Pinned and installed rather than trusting the image's own Python. windows-latest also ships
      # an App Execution Alias named `python3` that is not an interpreter — it prints "Python was
      # not found", points at the Microsoft Store, and exits 49 — and `gates.sh` probes past it by
      # running the candidate rather than locating it. setup-python puts a real one first either
      # way, so the two guards are independent.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: bash scripts/gates.sh hooks

  # The build broker (`scripts/heavy.py` and its PreToolUse hook): Windows only, the one platform
  # it runs on, and a job of its own because its tests take about six minutes of real waiting.
  broker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: bash scripts/gates.sh broker

  security:
    # Gitleaks reads content, not the OS, so one runner is enough.
    runs-on: ubuntu-latest
    steps:
      # A depth-1 checkout only sees the tip; a secret committed then removed is exactly what this
      # job must find, so it needs the full history.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Read from rust-toolchain.toml and passed as an argument, so the version lives in one place.
      # Windows runners default to the MSVC host; this repository's Windows builds use GNU (see
      # rust-toolchain.toml), so that leg sets the host first — the same line a Windows developer runs.
      - name: Install the pinned toolchain
        run: |
          if [ "$RUNNER_OS" = Windows ]; then rustup set default-host x86_64-pc-windows-gnu; fi
          toolchain="$(sed -n 's/^channel *= *"\(.*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --component clippy --component rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Install security tools
        run: |
          cargo install cargo-audit --locked
          gitleaks_version=8.30.0
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          mkdir -p "$RUNNER_TEMP/gitleaks" && tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - run: bash scripts/gates.sh security

  sidecars:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # The highest any sidecar's go.mod asks for. `gates.sh` discovers the modules rather than
          # listing them, so a new sidecar needs nothing here unless it needs a newer Go.
          go-version: '1.26.x'
          cache-dependency-path: sidecars/*/go.sum

      - run: bash scripts/gates.sh sidecars

  shell:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shell/package-lock.json

      # `gates.sh shell` refuses to run without node_modules rather than installing them, because
      # locally that state means "you have not set this up", not "install it for me".
      - name: Install shell dependencies
        working-directory: shell
        run: npm ci

      # `tauri::generate_context!()` embeds shell/dist at COMPILE time, and dist is gitignored — no
      # checkout ever carries one. `gates.sh shell` refuses its three src-tauri legs without it, so
      # until this step existed the job reported "frontend not built" and never reached them.
      - name: Build the frontend
        working-directory: shell
        run: npm run build

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev pkg-config

      # Read from rust-toolchain.toml and passed as an argument, so the version lives in one place.
      # Windows runners default to the MSVC host; this repository's Windows builds use GNU (see
      # rust-toolchain.toml), so that leg sets the host first — the same line a Windows developer runs.
      - name: Install the pinned toolchain
        run: |
          if [ "$RUNNER_OS" = Windows ]; then rustup set default-host x86_64-pc-windows-gnu; fi
          toolchain="$(sed -n 's/^channel *= *"\(.*\)"[[:space:]]*$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --component clippy --component rustfmt

      - run: bash scripts/gates.sh shell

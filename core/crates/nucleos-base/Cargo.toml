[package]
name = "nucleos-base"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The bottom layer of the núcleo (see src/lib.rs). No doctests: prose in doc comments was never
# written to compile.
[lib]
doctest = false

# `testkit` exposes the fixtures the crates above use in their tests (`testdb`, `storage::TempDb`,
# `router_client::test_support`, ...). `nucleos-core`'s own `testkit` turns this one on.
[features]
testkit = ["dep:tempfile"]

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
directories = "6.0.0"
keyring = { version = "4.1.5", features = ["windows-native-keyring-store"] }
# Same features as `nucleos-core`'s, which explains why `native-tls` must stay.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "native-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1.53.0", features = ["full"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5"
tempfile = { version = "3.27.0", optional = true }

# `process_tree.rs` only, for job objects (see `nucleos-core`'s manifest).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# `process_tree.rs` only, for `killpg(2)` (see `nucleos-core`'s manifest).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"
sqlx = { version = "0.9.0", features = ["sqlite-deserialize"] }

[package]
name = "nucleos-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
croner = "3.0.1"
directories = "6.0.0"
keyring = { version = "4.1.5", features = ["windows-native-keyring-store"] }
rand = "0.10.2"
# `native-tls` is NOT optional and must not be trimmed as an unused feature. Without a TLS backend
# `reqwest` builds fine and every `https://` request fails at runtime with "error sending request
# for url" — which is how this crate shipped for months unable to reach either of its two non-loopback
# hosts (`openai_compatible::OPENROUTER_BASE_URL`, `capabilities::OLLAMA_REGISTRY_URL`). The hosted assistant
# route had never completed a request; 3339 tests missed it because every fixture is an `axum`
# listener on plain `http://127.0.0.1`. `capabilities::tests::
# the_crate_is_built_with_a_tls_backend_and_stops_compiling_without_one` is the guard, and it fails
# to COMPILE if this line loses the feature.
#
# `native-tls` and not `rustls-tls`: this is a Windows desktop app, so TLS goes through schannel and
# the machine's own certificate store. That means it trusts what the user's machine already trusts —
# a corporate root, an inspecting proxy — where a bundled `rustls` root set would refuse those and
# present as "the internet is broken" on exactly the machines least able to debug it.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
rmcp = { version = "2.2", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
# `workflows.rs` only. A bundle's identity is the hash of its bytes — that is what lets this app
# install, eject and detect drift without ever parsing the graph inside it. Already in the lock file
# as something else's dependency, so this declares what is already built rather than adding a tree.
sha2 = "0.10"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
subtle = { version = "2.6.1", default-features = false }
tokio = { version = "1.53.0", features = ["full"] }
# Only for `ReaderStream`, which is what lets `GET /files/download` hand a file back without first
# holding all of it in memory. Already in the lock file, as something else's dependency.
tokio-util = { version = "0.7.19", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# Already in the tree via reqwest; declared directly because `trust.rs` must not parse a URL by
# hand. `https://docs.rs@evil.com/` has host `evil.com`, and every hand-rolled extractor gets that
# wrong at least once.
url = "2.5"

# `process_tree.rs` only, and only for job objects — the one Windows primitive that reaches a
# grandchild whose parent link the MSYS `fork` emulation severed (measured; see that module). Already
# in the lock file as tokio's own dependency, so this declares what is already built rather than
# adding a tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    # `capabilities::total_memory_bytes` only, for `GlobalMemoryStatusEx` — one call, so the model
    # picker can say whether a download will actually run on this machine before it spends the
    # gigabytes proving it won't. A feature on a crate already here, not a new tree.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# `process_tree.rs` only, for `killpg(2)`: signalling a process group without a `kill` program whose
# parsing of a negative pid is the program's to get wrong (measured: procps-ng 4.0.4 on Ubuntu 24.04
# read `kill -KILL -<pid>` as every process of the user). Already in the lock file as a dependency of
# tokio and others, so this declares what is already built rather than adding a tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

# The `nucleos-dev` bundle manifest.
#
# The bundle's source tree is laid out exactly as it is materialized into a project:
#
#   .nucleos/workflow/     workflow docs, speed table, prompt contract, packet schemas
#   .claude/skills/<s>/    the phase skills
#   .claude/agents/wf-*.md the phase cockpits
#   .agents/skills/<s>/    the Codex mirror, generated from .claude/skills/ at packaging time
#   agents-block.md        the managed block written into the project's AGENTS.md
#   scripts/               the gate and engine scripts; NEVER materialized
#   bundle.yaml            this file
#
# `name` and `version` are not fields here: they come from where the bundle sits in the library,
# `lib/<name>/<version>/bundle.yaml`. Scripts run from that library directory, and a project
# learns where it is from `.nucleos/workflow/project.json` (`id`, `state_dir`, `bundle_dir`),
# which the daemon writes at materialization. Per-project state (loops, plans, specs, memory,
# project.yaml, models.yaml, wave scratch) lives under `state_dir`, outside the working tree.
#
# `owns:` is the set of PROJECT paths this workflow claims authorship of. A row without a
# trailing `/` claims exactly that file; a row ending `/` claims everything under that
# directory. `scripts/` is deliberately absent: it is not materialized, so there is nothing
# in a project to own.
#
# `hooks:` is what the daemon wires into the project's Claude Code settings, each entry running
# `python <bundle_dir>/<script> <args>`. A script that is not listed here is called by a
# controller, never by a hook.
#   event: Stop | SubagentStop | UserPromptSubmit | SessionStart | PreToolUse | PostToolUse |
#          PostToolUseFailure (SessionStart is wired with the `compact` matcher only)
#   matcher: a tool-name regex, tool events only
#   script: path relative to this version directory
#   args: argv after the script
#   timeout_secs: 1..50
#
# `params:` declares the tunable parameters the daemon may version and (tier 1) let the tuner
# change, inside bounds, by editing ONE scalar of a YAML file under the project's state directory.
# The daemon reads it from the library copy only and never knows what a key means.
#   name: unique in the bundle; [A-Za-z0-9_.-]+, at most 64
#   type: int | float | bool | enum
#   min / max: int and float only, max >= min
#   values: enum only, non-empty and unique
#   default: optional; used when the key is absent in the file; must pass the type check
#   tier: 1 = the tuner may write it; 2 or 3 = owner only
#   file: relative to the state directory, forward slashes, .yaml or .yml
#   key: dotted path inside the file, one or two segments

description: >-
  The nucleos-dev workflow: triage, plan, execute, review and maintain phases, their packet
  schemas, their Claude Code and Codex cockpits, and the scripts that gate and run them
  (evidence and review gates, speed resolution, prompt assembly, spec loops, parallel waves),
  plus user agent pipelines and their synthesis.
origin: nucleos

# The managed block at the top of a project's AGENTS.md (between the `AI WORKFLOW MANAGED BLOCK`
# markers) is this file verbatim, markers included, and only that region is written. It must
# carry both markers.
agents_block: agents-block.md

# Tunable parameters. The bounds are the guard rails the tuner lives inside. `parallel_execute.*`
# has no default on purpose: the wave engine fails closed without it, so an absent key stays absent
# until the owner sets it.
params:
  - name: tree.max_live_branches
    type: int
    min: 1
    max: 12
    default: 4
    tier: 1
    file: project.yaml
    key: tree.max_live_branches
  - name: tree.floor_gb
    type: int
    min: 5
    max: 100
    default: 15
    tier: 1
    file: project.yaml
    key: tree.floor_gb
  - name: parallel_execute.max_workers
    type: int
    min: 1
    max: 4
    tier: 1
    file: models.yaml
    key: parallel_execute.max_workers
  - name: parallel_execute.max_units
    type: int
    min: 2
    max: 8
    tier: 1
    file: models.yaml
    key: parallel_execute.max_units
  - name: parallel_execute.max_wave_seconds
    type: int
    min: 300
    max: 7200
    tier: 1
    file: models.yaml
    key: parallel_execute.max_wave_seconds

owns:
  # ---- pipeline instructions, speed table, prompt contract, packet schemas ---------------------
  - .nucleos/workflow/

  # ---- the workflow's Claude Code skills ---------------------------------------------------------
  - .claude/skills/bootstrap/
  - .claude/skills/claude/
  - .claude/skills/codex/
  - .claude/skills/conduct/
  - .claude/skills/executor/
  - .claude/skills/maintenance/
  - .claude/skills/model-requests/
  - .claude/skills/orchestrate/
  - .claude/skills/orchestrate-agents/
  - .claude/skills/orchestrate-node/
  - .claude/skills/orchestrate-tdd/
  - .claude/skills/planner/
  - .claude/skills/rescue/
  - .claude/skills/reviewer/
  - .claude/skills/run-pipeline/
  - .claude/skills/skill-authoring/
  - .claude/skills/synthesizer/

  # ---- the phase cockpits: explicit files, not a blanket .claude/agents/ (a project may have
  # agents of its own under the same directory) ---------------------------------------------------
  - .claude/agents/wf-bootstrap.md
  - .claude/agents/wf-executor.md
  - .claude/agents/wf-leaf.md
  - .claude/agents/wf-maintenance.md
  - .claude/agents/wf-orchestrator.md
  - .claude/agents/wf-planner.md
  - .claude/agents/wf-rescue.md
  - .claude/agents/wf-reviewer.md
  - .claude/agents/wf-synthesizer.md
  - .claude/agents/wf-tree-orchestrator.md

  # ---- the Codex-controller mirror of the skills above, one directory per skill -----------------
  - .agents/skills/bootstrap/
  - .agents/skills/claude/
  - .agents/skills/codex/
  - .agents/skills/conduct/
  - .agents/skills/executor/
  - .agents/skills/maintenance/
  - .agents/skills/model-requests/
  - .agents/skills/orchestrate/
  - .agents/skills/orchestrate-agents/
  - .agents/skills/orchestrate-node/
  - .agents/skills/orchestrate-tdd/
  - .agents/skills/planner/
  - .agents/skills/rescue/
  - .agents/skills/reviewer/
  - .agents/skills/run-pipeline/
  - .agents/skills/skill-authoring/
  - .agents/skills/synthesizer/

hooks:
  # A spec session ends when its checklist does (workflow.md, "Spec sessions"). Both entry points
  # fail open: no project.json, no loop, an unreadable payload or any error lets the stop go.
  - event: Stop
    script: scripts/spec_loop.py
    args: [--stop-hook]
    timeout_secs: 10
  - event: UserPromptSubmit
    script: scripts/spec_loop.py
    args: [--prompt-hook]
    timeout_secs: 10
  # Re-injects the daemon's work tree after a native compact; fails open.
  - event: SessionStart
    script: scripts/rehydrate.py
    timeout_secs: 10

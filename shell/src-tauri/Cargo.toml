# Empty workspace table: this package is standalone by the root manifest's own design
# (see the comment above `exclude = ["shell/src-tauri"]` in the root Cargo.toml), but
# that exclude is a path RELATIVE to the root manifest, so it only ever covers this
# exact repo layout. Cargo resolves a package's workspace by walking UP the directory
# tree looking for an ancestor `[workspace]`; a checkout of this repo nested inside
# another checkout of it (e.g. a worktree created under
# `<project_root>/.nucleos/worktrees/`) sits, from cargo's point of view, inside the
# outer checkout's own workspace, at a path the outer exclude never named and so never
# excludes. Declaring this table makes the package its own workspace root, so cargo
# stops walking upward before it ever reaches an ancestor manifest, and it no longer
# matters what directory structure sits above the checkout.
[workspace]

[package]
name = "shell"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shell_lib"
# Desktop (Windows-only, spec §2) links the lib into the bin as an rlib. The `cdylib`
# from the default Tauri template is only needed for mobile targets and, on windows-gnu,
# blows past the PE format's 65535-export-per-DLL limit (it exports ~90k transitive public
# symbols), so it is dropped here. Re-add `"cdylib", "staticlib"` if/when mobile is targeted
# (and expect to need MSVC or an export filter for the cdylib on Windows).
crate-type = ["rlib"]

[profile.dev]
# Repeated from the workspace root rather than inherited: this package is excluded
# from that workspace (see the root manifest), so it carries its own profiles too.
# Same reason — full DWARF cost ~17 GB here and only file:line is ever read.
debug = "line-tables-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "4.1.5", features = ["windows-native-keyring-store"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
arboard = "3.6.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
# No tauri-plugin-updater: it was registered with a placeholder signing key and an
# example.invalid endpoint, held no updater capability and was imported by no frontend code,
# so it could never run — yet it shipped in the binary and in the bundle config, advertising
# an update channel that does not exist. Re-add it together with a real key, a real release
# feed and the capability, as one change.

[dev-dependencies]
# For `drop.rs`'s walk tests, which need a real directory tree to walk.
tempfile = "3.27.0"

# Empty workspace table: this package is standalone by the root manifest's own design
# (see the comment above `exclude = ["shell/src-tauri"]` in the root Cargo.toml), but
# that exclude is a path RELATIVE to the root manifest, so it only ever covers this
# exact repo layout. Cargo resolves a package's workspace by walking UP the directory
# tree looking for an ancestor `[workspace]`; a checkout of this repo nested inside
# another checkout of it (e.g. a worktree created under
# `<project_root>/.nucleos/worktrees/`) sits, from cargo's point of view, inside the
# outer checkout's own workspace, at a path the outer exclude never named and so never
# excludes. Declaring this table makes the package its own workspace root, so cargo
# stops walking upward before it ever reaches an ancestor manifest, and it no longer
# matters what directory structure sits above the checkout.
[workspace]

[package]
name = "shell"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shell_lib"
# Desktop (Windows-only, spec §2) links the lib into the bin as an rlib. The `cdylib`
# from the default Tauri template is only needed for mobile targets and, on windows-gnu,
# blows past the PE format's 65535-export-per-DLL limit (it exports ~90k transitive public
# symbols), so it is dropped here. Re-add `"cdylib", "staticlib"` if/when mobile is targeted
# (and expect to need MSVC or an export filter for the cdylib on Windows).
crate-type = ["rlib"]

[profile.dev]
# Repeated from the workspace root rather than inherited: this package is excluded
# from that workspace (see the root manifest), so it carries its own profiles too.
# Same reason — full DWARF cost ~17 GB here and only file:line is ever read.
debug = "line-tables-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "4.1.5", features = ["windows-native-keyring-store"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
# `wayland-data-control` costs nothing on Windows: it only enables arboard's optional
# `wl-clipboard-rs` dependency, which is itself gated on unix in arboard's manifest, so
# outside Linux the feature pulls in no crate and changes no code path. On Wayland it is
# what lets the clipboard be written at all, and writing the clipboard is the whole of the
# fallback there (see `WAYLAND_HELD` in `dictation.rs`).
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
# The updater is back, this time complete: a real release feed (tauri.conf.json), the
# `updater:default` capability, and a public key that comes from the owner. It only does
# anything in a release bundle (the `release-bundle` feature below).
tauri-plugin-updater = "2"
# `process:allow-restart`, so the shell can relaunch itself once an update is installed.
tauri-plugin-process = "2"

[features]
# CI builds the release bundle with this on. Dev and update-shell builds leave it off, so
# they never spawn a daemon nor offer updates.
release-bundle = []

[target.'cfg(target_os = "linux")'.dependencies]
# The Linux webview, named so lib.rs can switch its media stream on and answer its microphone
# permission request. Both already come in through tauri and wry at these versions (Cargo.lock:
# webkit2gtk 2.0.2, glib 0.18.5), so this declares what is built rather than adding a crate.
webkit2gtk = "2.0"
glib = "0.18"
# The X11 protocol, spoken directly rather than through a synthetic-input crate. `xtest` is
# the extension that lets one client inject a key event into another's focused window, which
# is the Linux half of `dictation::platform::send_paste`. x11rb is already in the lock at this
# version (arboard reaches for it), so this declares what is built rather than adding a crate.
x11rb = { version = "0.13", features = ["xtest"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Quartz, for the macOS half of `dictation::platform`: the on-screen window list that names the
# application in front, the event source whose flags say which modifiers are physically down, and
# the synthesised Cmd+V itself. `core-foundation` comes in beside it because the window list is a
# `CFArray` of `CFDictionary`, and reading one means wrapping CF types by hand. Both are already in
# `Cargo.lock` at these versions (core-graphics 0.25.0, core-foundation 0.10.1 - arboard and wry
# reach for them on macOS), so this declares what is built rather than adding a crate.
#
# `CGEventSourceFlagsState` and `AXIsProcessTrusted` are NOT wrapped by either crate and are
# declared `extern "C"` in `dictation.rs` against `CoreGraphics` and `ApplicationServices`, which
# need no manifest entry: a framework is named by the `#[link]` attribute, not by a dependency.
core-graphics = "0.25"
core-foundation = "0.10"

[dev-dependencies]
# For `drop.rs`'s walk tests, which need a real directory tree to walk.
tempfile = "3.27.0"

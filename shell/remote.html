    <!--
      The nonce channel, as in index.html, with the gateway standing in for Tauri: it replaces the
      literal __CSP_NONCE__ with a fresh value on every request and sends the same value in
      `style-src 'nonce-…'`. `src/lib/style-nonce.ts` reads it from here. Do not remove or fill it.
    -->
    <style nonce="__CSP_NONCE__"></style>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/remote/main.tsx"></script>
  </body>
